<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask App{% endblock %}</title>

    <!-- Bootstrap CSS 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 2. Your Custom CSS (MUST come after Bootstrap) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Simple Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">My Web Application</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/hello">Hello</a>
                <a class="nav-link" href="/about-css">About</a>
                <a class="nav-link" href="/favorite-course?favorite_subject=BMGT&course_number=407">Favorite Course</a>
                <a class="nav-link" href="/contact">Contact Me</a>
            </div>
        </div>
    </nav>


    <!-- Main Container Content Slot -->
    <main class="container">
        {% block content %}
        <!-- Child templates inject their page-specific HTML here -->
        {% endblock %}
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
